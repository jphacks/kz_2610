<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF;
    --cream: #FFF9EF;
    --field: #F4F5F2;
    --hairline: #E3E5E2;
    --ink: #1C1F1D;
    --body: #4F5550;
    --sub: #6B716D;
    --green: #27755B;
    --green-deep: #1F5E49;
    --mint: #DDF0E4;
    --mustard: #E8AD45;
    --like: #E5577E;
    --round: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
    --sans: "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ECEDEA;
    color: var(--ink);
    font-family: var(--sans);
    padding: 40px 16px 64px;
  }
  header.page { max-width: 1180px; margin: 0 auto 32px; }
  header.page h1 { font: 800 22px var(--round); }
  header.page p { color: var(--body); font-size: 14px; margin-top: 6px; line-height: 1.7; }
  .row {
    max-width: 1180px; margin: 0 auto;
    display: flex; flex-wrap: wrap; gap: 40px; justify-content: center;
  }
  figure { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  figcaption { text-align: center; max-width: 320px; }
  figcaption b { font: 800 16px var(--round); display: block; }
  figcaption span { font-size: 13px; color: var(--body); line-height: 1.6; display: block; margin-top: 4px; }

  /* ---- phone frame ---- */
  .phone {
    width: 340px; height: 736px; border-radius: 48px;
    background: #111; padding: 10px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.35);
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    border-radius: 38px; overflow: hidden;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 96px; height: 28px; border-radius: 20px; background: #000; z-index: 20;
  }
  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 19;
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 30px 0; font: 600 14px -apple-system, sans-serif;
  }
  .status.light { color: #fff; }
  .home-ind {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 5px; border-radius: 3px; background: var(--ink); z-index: 20;
  }
  .home-ind.light { background: rgba(255,255,255,.85); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 56px; border: 0; border-radius: 16px;
    font: 800 17px var(--round); cursor: pointer;
    transition: transform .12s ease, opacity .12s ease;
  }
  .btn:active { transform: scale(.98); opacity: .85; }
  .btn svg { width: 18px; height: 18px; }

  /* ================= A: のれん ================= */
  .a { background: var(--green); color: var(--cream); }
  .a .rod {
    position: absolute; top: 92px; left: 26px; right: 26px; height: 10px;
    background: #8A5A2B; border-radius: 5px; z-index: 3;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  .a .noren {
    position: absolute; top: 96px; left: 36px; right: 36px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
  }
  .a .cloth {
    height: 238px; background: var(--cream); color: var(--green);
    border-radius: 0 0 6px 6px;
    display: flex; justify-content: center; padding-top: 74px;
    font: 800 40px var(--round);
    transform-origin: top center;
    animation: sway 3.2s ease-in-out infinite;
    box-shadow: inset 0 14px 0 -4px rgba(39,117,91,.08);
  }
  .a .cloth:nth-child(2) { animation-delay: -.4s; }
  .a .cloth:nth-child(3) { animation-delay: -.8s; }
  .a .cloth:nth-child(4) { animation-delay: -1.2s; }
  .a .cloth .mark {
    position: absolute; bottom: 22px;
    width: 30px; height: 30px; opacity: .9;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg) skewX(0deg); }
    50% { transform: rotate(.8deg) skewX(-1.2deg); }
  }
  .a .bottom {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 0 28px 44px;
  }
  .a .tag {
    font: 800 27px/1.4 var(--round); white-space: nowrap;
  }
  .a .sub { margin-top: 14px; font-size: 14px; line-height: 1.8; opacity: .78; }
  .a .btn { margin-top: 32px; background: var(--cream); color: var(--green); }

  /* ================= B: 友達の輪 ================= */
  .b { background: var(--paper); }
  .b .stage { transform: scale(.82); transform-origin: top center;
    position: absolute; top: 78px; left: 0; right: 0; height: 330px;
    display: grid; place-items: center;
  }
  .b .ring-svg { width: 280px; height: 280px; overflow: visible; }
  .b .orbit { transform-origin: 140px 140px; animation: spin 40s linear infinite; }
  .b .orbit .face { animation: unspin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes unspin { to { transform: rotate(-360deg); } }
  .b .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 28px 44px; }
  .b .word { font: 800 15px var(--round); color: var(--green); letter-spacing: .04em; }
  .b .tag { margin-top: 8px; font: 800 27px/1.4 var(--round); white-space: nowrap; }
  .b .sub { margin-top: 14px; font-size: 14px; line-height: 1.8; color: var(--body); }
  .b .btn { margin-top: 32px; background: var(--green); color: #fff; }

  /* ================= C: 地図から ================= */
  .c { background: var(--field); }
  .c .map { position: absolute; inset: 0 0 300px 0; }
  .c .map svg { width: 100%; height: 100%; display: block; }
  .c .pin { animation: drop .6s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes drop { from { transform: translateY(-24px) scale(.6); opacity: 0; } }
  .c .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; height: 330px;
    background: var(--paper); border-radius: 28px 28px 0 0;
    padding: 30px 28px 44px; box-shadow: 0 -8px 30px rgba(0,0,0,.08);
    display: flex; flex-direction: column;
  }
  .c .brand { display: flex; align-items: center; gap: 10px; }
  .c .brand svg { width: 34px; height: 34px; }
  .c .brand b { font: 800 22px var(--round); color: var(--green); }
  .c .tag { margin-top: 18px; font: 800 25px/1.45 var(--round); white-space: nowrap; }
  .c .btn { margin-top: auto; background: var(--green); color: #fff; }
</style>
</head>
<body>
<header class="page">
  <h1>Welcome 画面 モック</h1>
  <p>ボタンは「はじめる」の1つだけ。機能の箇条書きと架空データ導線は削除。3案から方向性を選んでください（混ぜてもOK）。</p>
</header>

<div class="row">

  <!-- A -->
  <figure>
    <div class="phone"><div class="screen a">
      <div class="island"></div>
      <div class="status light"><span>9:41</span><span>●●●</span></div>
      <div class="rod"></div>
      <div class="noren">
        <div class="cloth">め</div>
        <div class="cloth">し</div>
        <div class="cloth">の</div>
        <div class="cloth">わ</div>
      </div>
      <div class="bottom">
        <p class="tag">おいしい店は、<br>友達が知っている。</p>
        <p class="sub">友達の評価だけでできた、<br>じぶんたちのグルメ地図。</p>
        <button class="btn">はじめる</button>
      </div>
      <div class="home-ind light"></div>
    </div></div>
    <figcaption><b>A. のれん</b><span>ブランド緑一面に、アプリ内タブと同じ「のれん」をくぐって入る。ゆらゆら揺れる。一番キャラが立つ案。</span></figcaption>
  </figure>

  <!-- B -->
  <figure>
    <div class="phone"><div class="screen b">
      <div class="island"></div>
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="stage">
        <svg class="ring-svg" viewBox="0 0 280 280">
          <circle cx="140" cy="140" r="96" fill="none" stroke="#27755B" stroke-width="30"/>
          <line x1="38" y1="58" x2="232" y2="164" stroke="#E8AD45" stroke-width="16" stroke-linecap="round"/>
          <line x1="26" y1="86" x2="220" y2="192" stroke="#E8AD45" stroke-width="16" stroke-linecap="round"/>
          <g class="orbit">
            <g class="face"><circle cx="140" cy="10" r="17" fill="#DDF0E4" stroke="#fff" stroke-width="4"/><text x="140" y="16" text-anchor="middle" font-size="15" font-weight="800" fill="#1F6B4F" font-family="M PLUS Rounded 1c">ゆ</text></g>
            <g class="face"><circle cx="252" cy="205" r="17" fill="#FBEBC8" stroke="#fff" stroke-width="4"/><text x="252" y="211" text-anchor="middle" font-size="15" font-weight="800" fill="#7A5410" font-family="M PLUS Rounded 1c">た</text></g>
            <g class="face"><circle cx="28" cy="205" r="17" fill="#FCE4EB" stroke="#fff" stroke-width="4"/><text x="28" y="211" text-anchor="middle" font-size="15" font-weight="800" fill="#A3254B" font-family="M PLUS Rounded 1c">さ</text></g>
          </g>
        </svg>
      </div>
      <div class="bottom">
        <p class="word">meshinowa</p>
        <p class="tag">おいしい店は、<br>友達が知っている。</p>
        <p class="sub">知らない人の星より、友達の「うまい」で選ぶ。</p>
        <button class="btn">はじめる</button>
      </div>
      <div class="home-ind"></div>
    </div></div>
    <figcaption><b>B. 友達の輪</b><span>白地にロゴを大きく。お椀の周りを友達アイコンがゆっくり回る＝「めしの輪」。いまのトーンに一番近い正統派。</span></figcaption>
  </figure>

  <!-- C -->
  <figure>
    <div class="phone"><div class="screen c">
      <div class="island"></div>
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="map">
        <svg viewBox="0 0 320 436" preserveAspectRatio="xMidYMid slice">
          <rect width="320" height="436" fill="#EEF0EB"/>
          <path d="M210 0 C230 120 300 160 320 190 L320 0Z" fill="#DDEBDD"/>
          <path d="M0 300 C60 280 90 340 160 330 C220 320 260 380 320 360 L320 436 L0 436Z" fill="#D6E6EE"/>
          <g stroke="#fff" stroke-linecap="round" fill="none">
            <path d="M-10 120 L330 170" stroke-width="14"/>
            <path d="M110 -10 L80 440" stroke-width="14"/>
            <path d="M-10 230 L330 250" stroke-width="9"/>
            <path d="M220 -10 L250 440" stroke-width="9"/>
            <path d="M0 50 L180 70" stroke-width="6"/>
            <path d="M160 160 L170 330" stroke-width="6"/>
            <path d="M270 120 L330 100" stroke-width="6"/>
          </g>
          <g class="pin" style="animation-delay:.1s"><path d="M70 196 c-12 0 -20 -8 -20 -19 a20 20 0 0 1 40 0 c0 11 -8 19 -20 19z" fill="#27755B"/><circle cx="70" cy="176" r="7" fill="#fff"/><path d="M70 196 l-6 10 h12z" fill="#27755B"/></g>
          <g class="pin" style="animation-delay:.25s"><circle cx="196" cy="110" r="18" fill="#fff"/><circle cx="196" cy="110" r="14" fill="#E8AD45"/><text x="196" y="115" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="M PLUS Rounded 1c">4.6</text></g>
          <g class="pin" style="animation-delay:.4s"><circle cx="262" cy="214" r="18" fill="#fff"/><circle cx="262" cy="214" r="14" fill="#27755B"/><text x="262" y="219" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="M PLUS Rounded 1c">4.2</text></g>
          <g class="pin" style="animation-delay:.55s"><circle cx="140" cy="290" r="15" fill="#fff"/><circle cx="140" cy="290" r="11" fill="#E5577E"/><path d="M135 288 a3 3 0 0 1 5 -2 a3 3 0 0 1 5 2 c0 3 -5 6 -5 6 s-5 -3 -5 -6z" fill="#fff"/></g>
          <g class="pin" style="animation-delay:.7s"><circle cx="40" cy="70" r="14" fill="#fff"/><circle cx="40" cy="70" r="10" fill="#27755B"/></g>
        </svg>
      </div>
      <div class="sheet">
        <div class="brand">
          <svg viewBox="0 0 200 200"><rect width="200" height="200" rx="46" fill="#27755B"/><circle cx="100" cy="106" r="58" fill="none" stroke="#FFF9EF" stroke-width="24"/><line x1="58" y1="48" x2="166" y2="108" stroke="#E8AD45" stroke-width="14" stroke-linecap="round"/><line x1="48" y1="64" x2="156" y2="124" stroke="#E8AD45" stroke-width="14" stroke-linecap="round"/></svg>
          <b>めしのわ</b>
        </div>
        <p class="tag">友達の「うまい」が、<br>そのまま地図になる。</p>
        <button class="btn">はじめる
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="home-ind"></div>
    </div></div>
    <figcaption><b>C. 地図から</b><span>上半分に地図とピンが落ちてくる演出、下にシート。アプリの中身（地図）が開く前から伝わる。説明文は1行だけ。</span></figcaption>
  </figure>

</div>
</body>
</html>
