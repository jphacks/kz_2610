name: meshinowa
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  GooglePlaces:
    url: https://github.com/googlemaps/ios-places-sdk
    exactVersion: 11.2.0
targets:
  meshinowa:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: GooglePlaces
        product: GooglePlacesSwift
    sources:
      - path: meshinowa
    info:
      path: meshinowa/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: meshinowa
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations:
          - ja
        CloudflareAPIURL: $(CLOUDFLARE_API_URL)
        GooglePlacesAPIKey: $(GOOGLE_PLACES_IOS_API_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - ZenMaruGothic-Medium.ttf
          - ZenMaruGothic-Bold.ttf
          - ZenMaruGothic-Black.ttf
          - MPLUSRounded1c-Bold.ttf
          - MPLUSRounded1c-ExtraBold.ttf
          - MPLUSRounded1c-Black.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.meshinowa.app
        OTHER_LDFLAGS: $(inherited) -ObjC
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  meshinowaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: meshinowa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.meshinowa.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  meshinowa:
    build:
      targets:
        meshinowa: all
    run:
      config: Debug
    test:
      targets:
        - meshinowaTests
