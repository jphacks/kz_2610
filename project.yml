name: meshinowa
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  meshinowa:
    type: application
    platform: iOS
    sources:
      - path: meshinowa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.meshinowa.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: meshinowa
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  meshinowa:
    build:
      targets:
        meshinowa: all
    run:
      config: Debug
