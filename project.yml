name: meshinowa
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  meshinowa:
    type: application
    platform: iOS
    sources:
      - path: meshinowa
    info:
      path: meshinowa/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: meshinowa
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - ZenMaruGothic-Medium.ttf
          - ZenMaruGothic-Bold.ttf
          - ZenMaruGothic-Black.ttf
          - MPLUSRounded1c-Bold.ttf
          - MPLUSRounded1c-ExtraBold.ttf
          - MPLUSRounded1c-Black.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.meshinowa.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  meshinowa:
    build:
      targets:
        meshinowa: all
    run:
      config: Debug
